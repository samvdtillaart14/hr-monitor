name: Tests

# Draait bij elke push en pull request die app-logica, scores, tests of testdata raakt.
# Zie docs/TESTPLAN.md voor wat elke test dekt.
on:
  push:
    branches: [main]   # andere branches draaien via de pull request (scheelt dubbele Mac-runs)
    paths: ['scores/**', 'ios/**', 'testdata/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['scores/**', 'ios/**', 'testdata/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  js:
    name: JS (scores, BLE-referentie, randgevallen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/*.test.mjs
        working-directory: scores

  # Swift-tests draaien in de iOS build (ios.yml), zodat er maar één Mac nodig is.
