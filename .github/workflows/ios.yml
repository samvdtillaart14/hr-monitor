name: iOS build

on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installeren en project genereren
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Bouwen (zonder ondertekening; AltStore ondertekent met je Apple ID)
        working-directory: ios
        run: |
          xcodebuild -project HRMonitor.xcodeproj -scheme HRMonitor \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: IPA maken
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HRMonitor.app Payload/
          # Ad-hoc ondertekenen met de app-groep, zodat AltStore de groep voor app en widget registreert.
          for x in Payload/HRMonitor.app/PlugIns/*.appex; do
            [ -d "$x" ] && codesign -f -s - --entitlements Shared/AppGroup.entitlements "$x"
          done
          codesign -f -s - --entitlements Shared/AppGroup.entitlements Payload/HRMonitor.app
          zip -qry HRMonitor.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HRMonitor-ipa
          path: ios/HRMonitor.ipa

      - name: Publiceren als release 'latest'
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pulse (laatste build)
          prerelease: false
          make_latest: true
          files: ios/HRMonitor.ipa
          body: |
            Automatische build van commit ${{ github.sha }}.
            Installeer HRMonitor.ipa met AltStore of Sideloadly; zie README.

      - name: AltStore-bron (apps.json) bijwerken
        if: github.ref == 'refs/heads/main'
        env:
          RUN: ${{ github.run_number }}
        run: |
          SIZE=$(stat -f%z ios/HRMonitor.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > apps.json <<JSON
          {
            "name": "Pulse",
            "identifier": "nl.samvdtillaart.hrmonitor.source",
            "sourceURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/apps.json",
            "apps": [{
              "name": "Pulse",
              "bundleIdentifier": "nl.samvdtillaart.hrmonitor",
              "developerName": "Sam",
              "subtitle": "Whoop-hartslag en -data via Bluetooth",
              "localizedDescription": "Leest je Whoop-band uit via Bluetooth, ook met het scherm uit.",
              "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/icon-512.png",
              "tintColor": "00F19F",
              "versions": [{
                "version": "1.0.$RUN",
                "buildVersion": "$RUN",
                "date": "$DATE",
                "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/HRMonitor.ipa",
                "size": $SIZE,
                "minOSVersion": "17.0"
              }],
              "appPermissions": {
                "entitlements": [],
                "privacy": { "NSBluetoothAlwaysUsageDescription": "Pulse verbindt via Bluetooth met je hartslagband." }
              }
            }],
            "news": []
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "AltStore-bron: versie 1.0.$RUN" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

