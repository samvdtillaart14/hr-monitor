name: HRMonitor
options:
  bundleIdPrefix: nl.samvdtillaart
  deploymentTarget:
    iOS: "17.0"
packages:
  WhoopScores:
    path: WhoopScores
targets:
  HRMonitor:
    type: application
    platform: iOS
    sources: [HRMonitor, Shared/WidgetSnapshot.swift]
    dependencies:
      - package: WhoopScores
      - target: PulseWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.samvdtillaart.hrmonitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HRMonitor/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Oude (iOS 18-)vormgeving van tabbalk en knoppen houden, ook met de iOS 26-SDK op macos-latest.
        UIDesignRequiresCompatibility: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Pulse verbindt via Bluetooth met je hartslagband.
        NSMotionUsageDescription: Pulse gebruikt je stappen en de bewegingsherkenning van je iPhone om activiteiten (zoals hardlopen) te herkennen en te tellen.
        NSLocationWhenInUseUsageDescription: Pulse neemt je route op (kaart, afstand en tempo) tijdens een activiteit die je zelf start.
        NSLocationAlwaysAndWhenInUseUsageDescription: Pulse neemt je route op tijdens een activiteit die je zelf start, ook met het scherm uit.
        UIBackgroundModes: [bluetooth-central, location]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  PulseWidget:
    type: app-extension
    platform: iOS
    sources: [PulseWidget, Shared/WidgetSnapshot.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.samvdtillaart.hrmonitor.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PulseWidget/Info.plist
        CODE_SIGNING_ALLOWED: NO
        APPLICATION_EXTENSION_API_ONLY: YES
