name: HRMonitor
options:
  bundleIdPrefix: nl.samvdtillaart
  deploymentTarget:
    iOS: "17.0"
packages:
  WhoopScores:
    path: WhoopScores
targets:
  HRMonitor:
    type: application
    platform: iOS
    sources: [HRMonitor]
    dependencies:
      - package: WhoopScores
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.samvdtillaart.hrmonitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HRMonitor/Info.plist
      properties:
        CFBundleDisplayName: HR Monitor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: HR Monitor verbindt via Bluetooth met je hartslagband.
        NSMotionUsageDescription: HR Monitor gebruikt je stappen en de bewegingsherkenning van je iPhone om activiteiten (zoals hardlopen) te herkennen en te tellen.
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
